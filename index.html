<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>ShdMap</title>

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500" />
  <style>
    :root{
      --bg:#07080b;
      --bg2:#0b0a10;
      --neon:#ff1744;
      --neon2:#b10024;
      --text:#f3f4f6;
      --muted:#b7b7c2;
      --shadow: 0 12px 30px rgba(0,0,0,.55);
      --glow: 0 0 18px rgba(255, 23, 68, .35);
    }

    @font-face{ font-family:cf; src:url(font.ttf) format(truetype); }

    *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

    html,body{
      height:100%;
      -webkit-user-select:none;
      -moz-user-select:none;
      -ms-user-select:none;
      user-select:none;
      -webkit-touch-callout:none;

      /* чтобы при оверскролле не светилось белым */
      background-color: var(--bg);
      background-image:
        radial-gradient(1200px 700px at 50% -10%, rgba(255, 23, 68, .18), transparent 55%),
        radial-gradient(900px 600px at 20% 110%, rgba(177, 0, 36, .20), transparent 60%),
        linear-gradient(180deg, var(--bg), var(--bg2));

      /* запрет "резинки" где поддерживается */
      overscroll-behavior: none;
    }

    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, "Noto Sans", "Liberation Sans", sans-serif;
      color:var(--text);
      overflow:hidden;
    }

    /* Canvas FX */
    #fx{
      position:fixed;
      inset:0;
      width:100vw;
      height:100vh;
      z-index:0;
      display:block;
      filter: blur(.2px);
      pointer-events:none;
    }

    .vignette{
      position:fixed;
      inset:-2px;
      pointer-events:none;
      z-index:1;
      background:
        radial-gradient(closest-side at 50% 40%, transparent 35%, rgba(0,0,0,.65) 100%),
        linear-gradient(180deg, rgba(0,0,0,.25), rgba(0,0,0,.55));
      mix-blend-mode: multiply;
    }

    /* scroll */
    #a{
      position:fixed;
      inset:0;
      height:100svh;
      height:100dvh;

      overflow-y:auto;
      -webkit-overflow-scrolling:touch;
      scrollbar-width:none;
      will-change:transform;
      z-index:3;

      overscroll-behavior: none;
      overscroll-behavior-y: none;
      touch-action: pan-y;

      /* на всякий */
      background-color: var(--bg);
      background-image:
        radial-gradient(1200px 700px at 50% -10%, rgba(255, 23, 68, .18), transparent 55%),
        radial-gradient(900px 600px at 20% 110%, rgba(177, 0, 36, .20), transparent 60%),
        linear-gradient(180deg, var(--bg), var(--bg2));
    }
    #a::-webkit-scrollbar{ display:none; }

    #b{
      width:100%;
      display:flex;
      flex-direction:column;
      align-items:center;
      padding:24px 0 40px;
      padding-top: calc(24px + env(safe-area-inset-top));
      padding-bottom: calc(40px + env(safe-area-inset-bottom));
      transform:translateZ(0);
    }

    .c{ width:100%; text-align:center; padding:24px 0 8px; }

    .d{
      color:rgba(255,255,255,.88);
      font-size:36px;
      font-weight:400;
      letter-spacing:.5px;
      font-family:cf,sans-serif;
      text-shadow: 0 10px 24px rgba(0,0,0,.55), 0 0 16px rgba(255, 23, 68, .18);
    }

    /* Card style = "glass" */
    .e{
      width:calc(100% - 32px);
      max-width:600px;
      border-radius:28px;
      margin:16px;
      padding:16px;

      background: rgba(8, 6, 12, .28);
      border:1px solid rgba(255, 23, 68, .18);
      box-shadow: var(--shadow), var(--glow);
      overflow:hidden;

      backdrop-filter: blur(18px) saturate(140%);
      -webkit-backdrop-filter: blur(18px) saturate(140%);
      isolation:isolate;

      position:relative;

      transform: translateY(12px) scale(.985);
      opacity:0;
      animation: popIn 900ms cubic-bezier(.2,.9,.2,1) forwards;
      will-change: transform, opacity, filter;
    }

    .e::before{
      content:"";
      position:absolute;
      inset:0;
      pointer-events:none;
      background:
        radial-gradient(120% 90% at 10% 0%, rgba(255,255,255,.10), transparent 60%),
        linear-gradient(180deg, rgba(255,255,255,.06), transparent 35%);
      opacity:.55;
      mix-blend-mode: screen;
    }

    @keyframes popIn{
      0%{ opacity:0; transform: translateY(18px) scale(.98); filter: blur(6px); }
      100%{ opacity:1; transform: translateY(0) scale(1); filter: blur(0px); }
    }

    /* IMAGE BOX — БЕЗ СКРУГЛЕНИЙ */
    .f{
      width:100%;
      min-height:180px;
      margin-bottom:12px;
      display:flex;
      align-items:center;
      justify-content:center;

      border-radius:0;
      overflow:visible;

      background: rgba(6,5,9,.10);
      border:1px solid rgba(255, 23, 68, .10);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.02);
      position:relative;
    }

    /* skeleton */
    .n{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      background: linear-gradient(90deg,
        rgba(255,23,68,.04) 25%,
        rgba(255,23,68,.07) 50%,
        rgba(255,23,68,.04) 75%);
      background-size:400% 100%;
      animation:o 1.5s infinite;
    }
    @keyframes o{ 0%{background-position:200% 0} to{background-position:-200% 0} }

    .g{
      width:100%;
      height:auto;
      object-fit:contain;
      opacity:0;
      transition:opacity .2s;
      image-rendering:crisp-edges;
      backface-visibility:hidden;

      pointer-events:none;
      -webkit-user-drag:none;
    }
    .g.l{ opacity:1; }

    .h{
      color: rgba(255, 23, 68, .92);
      font-size:24px;
      font-weight:800;
      text-align:center;
      margin-bottom:12px;
      line-height:1.2;
      text-shadow: 0 0 14px rgba(255, 23, 68, .25);
    }

    .i,.j{
      color: rgba(255,255,255,.92);
      font-size:18px;
      text-align:center;
      margin-bottom:4px;
      font-weight:500;
    }

    /* time NOT bold */
    .k{
      font-family:'Roboto Mono',monospace;
      font-size:18px;
      color: rgba(255,255,255,.95);
      text-align:center;
      margin:4px 0;
      font-variant-numeric:tabular-nums;
      display:inline;
      font-weight:400;
    }

    .l{
      color: rgba(255,255,255,.65);
      font-size:16px;
      text-align:center;
      padding:2px 0 8px;
    }

    img{ -webkit-user-drag:none; }

    @media (max-width:600px){
      .d{ font-size:36px; }
      .h{ font-size:24px; }
    }
    @media (max-width:400px){
      .d{ font-size:32px; }
      .h{ font-size:22px; }
      .i,.j{ font-size:16px; }
      .k{ font-size:16px; }
      .l{ font-size:14px; }
    }

    @media (prefers-reduced-motion: reduce){
      *{ animation:none !important; transition:none !important; }
      .e{ opacity:1; transform:none; filter:none; }
    }
  </style>
</head>

<body>
  <canvas id="fx"></canvas>
  <div class="vignette"></div>

  <div id="a"><div id="b"></div></div>

  <script>
    // запрет ПКМ
    document.addEventListener('contextmenu', (e) => e.preventDefault(), { passive:false });
    // запрет drag вообще
    document.addEventListener('dragstart', (e) => e.preventDefault(), { passive:false });

    /* =========================
       SHDMAP LOGIC
       ========================= */
    const M = [
      "Штольня","Лотос","Крокет","Всё или Ничего","Полёт Фантазии","Лесные Лилии",
      "Станция «Северный Парк»","Запутанная Лоза","Убежище","Озеро Мертвецов",
      "Строительные Леса","Замок Кристального ока","Тысяча Озёр","Закрытое Сообщество"
    ];

    function L(i){
      const b = location.origin + location.pathname;
      const d = b.substring(0, b.lastIndexOf('/'));
      return d + '/' + i + '.png';
    }

    const imgCache = {};
    let ticking=false, lastScrollTime=0;

    function K(){
      for(let i=1;i<=14;i++){
        const img = new Image();
        img.src = L(i);
        imgCache[i]=img;
      }
    }

    function J(){
      const n=new Date();
      const d=new Date(n.toLocaleString('en-US',{timeZone:'Europe/Moscow'}));
      const b=new Date(Date.UTC(2025,0,21,21));
      const t=d.getTime()-b.getTime();
      let a=Math.floor(t/864e5);
      if(d.getHours()>=23) a++;
      return (7+a)%14;
    }

    function I(d){
      const m=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
      const w=['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];
      return d.getDate()+' '+m[d.getMonth()]+', '+w[d.getDay()];
    }

    function H(p){
      const n=new Date();
      const d=new Date(n.toLocaleString('en-US',{timeZone:'Europe/Moscow'}));
      const a=new Date(d);
      const offsetDays = (p === 0) ? 0 : (p - 1);
      a.setDate(a.getDate() + offsetDays);
      a.setHours(23,0,0,0);

      const s=Math.max(Math.floor((a.getTime()-d.getTime())/1000),0);
      const D=Math.floor(s/86400);
      const h=Math.floor((s%86400)/3600);
      const m=Math.floor((s%3600)/60);
      const S=s%60;

      return (D<10?'0':'')+D+':'+(h<10?'0':'')+h+':'+(m<10?'0':'')+m+':'+(S<10?'0':'')+S;
    }

    function G(p){
      const n=new Date();
      const d=new Date(n.toLocaleString('en-US',{timeZone:'Europe/Moscow'}));
      const r=new Date(d);
      r.setDate(r.getDate()+p);
      r.setHours(23,0,0,0);
      return r;
    }

    function makeCard(i,p){
      const idx = i+1;
      const name = M[i];
      const url = L(idx);

      const card = document.createElement('div');
      card.className = 'e';
      card.id = 'e-'+idx;

      const imgBox = document.createElement('div');
      imgBox.className = 'f';

      const skel = document.createElement('div');
      skel.className = 'n';
      skel.id = 'n-'+idx;

      const img = document.createElement('img');
      img.className = 'g';
      img.id = 'g-'+idx;
      img.loading = 'lazy';
      img.alt = name;
      img.src = url;
      img.draggable = false;

      img.addEventListener('load', () => {
        skel.style.display = 'none';
        img.classList.add('l');
      });

      img.addEventListener('error', () => {
        img.style.display = 'none';
        skel.style.background = 'rgba(6,5,9,.35)';
        skel.style.animation = 'none';
        skel.innerHTML = '<div style="color:#ff1744;text-align:center;padding-top:70px">Ошибка</div>';
      });

      imgBox.appendChild(skel);
      imgBox.appendChild(img);

      const title = document.createElement('div');
      title.className = 'h';
      title.textContent = name;

      const when = document.createElement('div');
      if(p===0){
        when.className = 'i';
        when.textContent = 'Сегодня';
      }else{
        when.className = 'j';
        when.innerHTML = 'Через <span class="k" id="k-'+idx+'">'+H(p)+'</span>';
      }

      const date = document.createElement('div');
      date.className = 'l';
      date.textContent = I(G(p));

      card.appendChild(imgBox);
      card.appendChild(title);
      card.appendChild(when);
      card.appendChild(date);

      return card;
    }

    function E(){
      if(ticking) return;
      ticking=true;
      requestAnimationFrame(()=>{
        const now=Date.now();
        if(now-lastScrollTime<100){ ticking=false; return; }
        lastScrollTime=now;

        for(let p=0;p<14;p++){
          const tm=H(p);
          const idx=(J()+p)%14+1;
          const el=document.getElementById('k-'+idx);
          if(el) el.textContent = tm;
        }
        ticking=false;
      });
    }

    function D(){
      const root = document.getElementById('b');
      root.innerHTML = '';

      const head = document.createElement('div');
      head.className = 'c';
      head.innerHTML = '<div class="d">Created by Cvieripe</div>';
      root.appendChild(head);

      K();
      const o=J();
      for(let i=0;i<14;i++){
        const a=(o+i)%14;
        root.appendChild(makeCard(a,i));
      }

      setInterval(()=>{ requestAnimationFrame(E); }, 1000);
      E();

      // retry broken images
      setTimeout(()=>{
        for(let i=1;i<=14;i++){
          const im=document.getElementById('g-'+i);
          if(im && im.naturalWidth===0){
            im.src = im.src + (im.src.includes('?')?'&':'?') + 't=' + Date.now();
          }
        }
      },2000);
    }

    if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', D);
    else D();

    window.addEventListener('focus', ()=>{
      setTimeout(()=>{
        document.querySelectorAll('.g').forEach(im=>{
          if(im.naturalWidth===0){
            im.src = im.src + (im.src.includes('?')?'&':'?') + 't=' + Date.now();
          }
        });
      },100);
    });

    /* ==========================================================
       FIX: режем резинку/перетяжку (Chrome Android) чтобы не было белой полосы
       ========================================================== */
    (function(){
      const scroller = document.getElementById('a');
      let startY = 0;

      scroller.addEventListener('touchstart', (e) => {
        if (!e.touches || !e.touches[0]) return;
        startY = e.touches[0].clientY;
      }, { passive: true });

      scroller.addEventListener('touchmove', (e) => {
        if (!e.touches || !e.touches[0]) return;

        const y = e.touches[0].clientY;
        const dy = y - startY;

        const top = scroller.scrollTop <= 0;
        const bottom = scroller.scrollTop + scroller.clientHeight >= scroller.scrollHeight - 1;

        // тянем вниз на самом верху -> блок
        if (top && dy > 0) {
          e.preventDefault();
          return;
        }
        // тянем вверх в самом низу -> блок
        if (bottom && dy < 0) {
          e.preventDefault();
          return;
        }
      }, { passive: false });
    })();

    /* ==========================================================
       ULTRA OPTIMIZED PARTICLES (фикс ресетов на мобиле)
       ========================================================== */
    (function(){
      const canvas = document.getElementById('fx');
      const ctx = canvas.getContext('2d', { alpha:true });

      let DPR = Math.max(1, Math.min(1.5, window.devicePixelRatio || 1));

      function resize(){
        DPR = Math.max(1, Math.min(1.5, window.devicePixelRatio || 1));
        canvas.width  = Math.floor(innerWidth * DPR);
        canvas.height = Math.floor(innerHeight * DPR);
        canvas.style.width  = innerWidth + 'px';
        canvas.style.height = innerHeight + 'px';
        ctx.setTransform(DPR,0,0,DPR,0,0);
        ctx.imageSmoothingEnabled = true;
      }

      let seed = (Date.now() ^ (innerWidth * 73856093) ^ (innerHeight * 19349663)) >>> 0;
      function rnd(){
        seed |= 0;
        seed = (seed + 0x6D2B79F5) | 0;
        let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
        t ^= t + Math.imul(t ^ (t >>> 7), 61 | t);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      }
      const rand = (a,b)=> a + rnd()*(b-a);

      const makeCanvas = (w,h) => {
        if(typeof OffscreenCanvas !== 'undefined') return new OffscreenCanvas(w,h);
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        return c;
      };

      function makePolylinePoints(){
        const segs = (rand(2, 5) | 0);
        const pts = [{x:0,y:0}];
        let x=0, y=0;
        let step = rand(18, 34);
        for(let i=0;i<segs;i++){
          const ang = rand(-Math.PI*0.95, Math.PI*0.95);
          x += Math.cos(ang) * step;
          y += Math.sin(ang) * step;
          pts.push({x,y});
          step *= rand(0.75, 1.05);
        }
        let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
        for(const p of pts){
          if(p.x<minX) minX=p.x;
          if(p.y<minY) minY=p.y;
          if(p.x>maxX) maxX=p.x;
          if(p.y>maxY) maxY=p.y;
        }
        const cx=(minX+maxX)/2, cy=(minY+maxY)/2;
        for(const p of pts){ p.x-=cx; p.y-=cy; }
        return pts;
      }

      function pointsToPath(pts){
        const path = new Path2D();
        path.moveTo(pts[0].x, pts[0].y);
        for(let i=1;i<pts.length;i++) path.lineTo(pts[i].x, pts[i].y);
        return path;
      }

      function buildSprite(basePath, width){
        const size = 140;
        const c = makeCanvas(size, size);
        const g = c.getContext('2d', { alpha:true });

        g.translate(size/2, size/2);
        g.lineCap = 'round';
        g.lineJoin = 'round';

        g.globalAlpha = 0.9;
        g.strokeStyle = 'rgba(255, 23, 68, 0.35)';
        g.lineWidth = width + 6;
        g.shadowColor = 'rgba(255, 23, 68, 0.55)';
        g.shadowBlur  = 14;
        g.stroke(basePath);

        g.globalAlpha = 1.0;
        g.strokeStyle = 'rgba(255, 255, 255, 0.82)';
        g.lineWidth = width;
        g.shadowColor = 'rgba(255, 23, 68, 0.20)';
        g.shadowBlur  = 6;
        g.stroke(basePath);

        return { canvas: c, half: size/2 };
      }

      /* меньше частиц на телефоне */
      const isMobile = matchMedia('(max-width: 600px)').matches || ('ontouchstart' in window);
      const isLowCPU = (navigator.hardwareConcurrency && navigator.hardwareConcurrency <= 4);
      const MAX = isMobile ? (isLowCPU ? 18 : 26) : 70;

      const particles = new Array(MAX);

      const sinPhase = new Float32Array(MAX);
      const cosPhase = new Float32Array(MAX);
      for(let i=0;i<MAX;i++){ sinPhase[i]=Math.sin(i); cosPhase[i]=Math.cos(i); }

      const pointer = {
        x: innerWidth * 0.5,
        y: innerHeight * 0.5,
        active: false,
        last: 0
      };

      function setPointerFromEvent(e){
        pointer.x = e.clientX;
        pointer.y = e.clientY;
        pointer.active = true;
        pointer.last = performance.now();
      }

      addEventListener('pointermove', setPointerFromEvent, { passive:true });
      addEventListener('pointerdown', setPointerFromEvent, { passive:true });
      addEventListener('pointerleave', () => { pointer.active = false; }, { passive:true });
      addEventListener('blur', () => { pointer.active = false; }, { passive:true });

      const REPULSE_R = 180;
      const REPULSE_R2 = REPULSE_R * REPULSE_R;
      const REPULSE_STRENGTH = 1400;
      const SPRING_BACK = 18;
      const DAMP = 10;
      const MAX_OFF = 120;
      const POINTER_COOLDOWN_MS = 180;

      function resetParticle(p, fromAnywhere){
        const cols = Math.max(8, Math.min(14, (innerWidth / 120) | 0));
        const col = (rnd() * cols) | 0;
        const colW = innerWidth / cols;

        const x = (col + rand(0.15, 0.85)) * colW;
        const y = fromAnywhere ? rand(-40, innerHeight + 40) : rand(-innerHeight*0.25, -40);

        p.baseX = x;
        p.baseY = y;
        p.x = x;
        p.y = y;

        /* на телефоне немного спокойнее скорость, чтобы реже "перерождались" */
        p.vy = isMobile ? rand(22, 62) : rand(28, 78);
        p.vx = rand(-14, 14);
        p.rot = rand(0, Math.PI*2);
        p.vr  = rand(-1.4, 1.4);
        p.scale = rand(0.65, 1.45);
        p.alpha = rand(0.22, 0.58);
        p.width = rand(3.0, 6.0);

        p.ox = 0; p.oy = 0;
        p.ovx = 0; p.ovy = 0;

        const pts = makePolylinePoints();
        const path = pointsToPath(pts);
        p.sprite = buildSprite(path, p.width);

        p.phase = (rnd() * MAX) | 0;
      }

      for(let i=0;i<MAX;i++){
        particles[i] = {
          baseX:0, baseY:0, x:0, y:0,
          vx:0, vy:0, rot:0, vr:0,
          scale:1, alpha:0.4, width:4,
          ox:0, oy:0, ovx:0, ovy:0,
          phase:0, sprite:null
        };
        resetParticle(particles[i], true);
      }

      // ФИКС ресетов: НЕ респавним всё при "мелком resize" от адресной строки
      let lastW = innerWidth;
      let lastH = innerHeight;
      const vv = window.visualViewport;

      function onResize(){
        const w = innerWidth;
        const h = innerHeight;

        const dw = Math.abs(w - lastW);
        const dh = Math.abs(h - lastH);

        // высота немного прыгнула (адресная строка) -> не считаем настоящим resize
        const toolbarResize = (dw === 0 && dh > 0 && dh < 120);

        resize();

        if (!toolbarResize) {
          const sx = w / (lastW || w);
          const sy = h / (lastH || h);

          for(let i=0;i<MAX;i++){
            const p = particles[i];
            p.baseX *= sx; p.baseY *= sy;
            p.x *= sx;     p.y *= sy;
          }
          // ВАЖНО: НЕ делаем reseedAndRespawnAll()
        }

        lastW = w;
        lastH = h;
      }

      if (vv) vv.addEventListener('resize', onResize, { passive:true });
      else addEventListener('resize', onResize, { passive:true });

      onResize();

      let last = performance.now();
      let rafId = 0;

      function drawParticle(p){
        const s = p.sprite;
        const c = Math.cos(p.rot), sn = Math.sin(p.rot);
        const sc = p.scale * DPR;

        ctx.setTransform(
          sc * c,  sc * sn,
          sc * -sn, sc * c,
          p.x * DPR, p.y * DPR
        );

        ctx.globalAlpha = p.alpha + 0.25;
        ctx.drawImage(s.canvas, -s.half, -s.half);
      }

      function tick(now){
        const dt = Math.min((now - last) / 1000, 0.033);
        last = now;

        const t = now / 1000;
        const sinT = Math.sin(t);
        const cosT = Math.cos(t);

        ctx.setTransform(DPR,0,0,DPR,0,0);
        ctx.globalAlpha = 1;
        ctx.fillStyle = 'rgba(7, 8, 11, 0.18)';
        ctx.fillRect(0, 0, innerWidth, innerHeight);

        const pointerFresh = pointer.active && (now - pointer.last) < POINTER_COOLDOWN_MS;
        const px = pointer.x, py = pointer.y;

        for(let i=0;i<MAX;i++){
          const p = particles[i];

          p.baseX += p.vx * dt;
          p.baseY += p.vy * dt;
          p.rot   += p.vr * dt;

          p.vx += (sinT * cosPhase[p.phase] + cosT * sinPhase[p.phase]) * 0.02;

          p.ovx += (-p.ox) * SPRING_BACK * dt;
          p.ovy += (-p.oy) * SPRING_BACK * dt;

          if(pointerFresh){
            const dx = (p.baseX + p.ox) - px;
            const dy = (p.baseY + p.oy) - py;
            const d2 = dx*dx + dy*dy;

            if(d2 < REPULSE_R2 && d2 > 0.0001){
              const d = Math.sqrt(d2);
              const k = (1 - (d / REPULSE_R));
              const f = (REPULSE_STRENGTH * k * k);
              const nx = dx / d;
              const ny = dy / d;
              p.ovx += nx * f * dt;
              p.ovy += ny * f * dt;
            }
          }

          const damp = Math.max(0, 1 - DAMP * dt);
          p.ovx *= damp;
          p.ovy *= damp;

          p.ox += p.ovx * dt;
          p.oy += p.ovy * dt;

          if(p.ox >  MAX_OFF) { p.ox =  MAX_OFF; p.ovx *= 0.2; }
          if(p.ox < -MAX_OFF) { p.ox = -MAX_OFF; p.ovx *= 0.2; }
          if(p.oy >  MAX_OFF) { p.oy =  MAX_OFF; p.ovy *= 0.2; }
          if(p.oy < -MAX_OFF) { p.oy = -MAX_OFF; p.ovy *= 0.2; }

          p.x = p.baseX + p.ox;
          p.y = p.baseY + p.oy;

          drawParticle(p);

          if(p.y > innerHeight + 120 || p.x < -160 || p.x > innerWidth + 160){
            resetParticle(p, false);
          }
        }

        rafId = requestAnimationFrame(tick);
      }

      function startFx(){
        if(rafId) return;
        last = performance.now();
        rafId = requestAnimationFrame(tick);
      }

      function stopFx(){
        if(!rafId) return;
        cancelAnimationFrame(rafId);
        rafId = 0;
      }

      document.addEventListener('visibilitychange', () => {
        if(document.hidden) stopFx();
        else startFx();
      });

      startFx();
    })();
  </script>
</body>
</html>
