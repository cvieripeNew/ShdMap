<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShdMap</title>
    <style>
        @font-face {
            font-family: 'CustomFont';
            src: url('font.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            background-color: #000000;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #FFFFFF;
            overflow-x: hidden;
            min-height: 100vh;
        }
        
        #scrollView {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            -ms-overflow-style: none;
            background-color: #000000;
        }
        
        #scrollView::-webkit-scrollbar {
            display: none;
        }
        
        #mainContainer {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 24px;
            padding-bottom: 40px;
        }
        
        .header {
            width: 100%;
            text-align: center;
            padding: 24px 0 8px 0;
        }
        
        .header-text {
            color: #FFFFFF;
            font-size: 36px;
            font-weight: 400;
            letter-spacing: 0.5px;
            font-family: 'CustomFont', -apple-system, sans-serif;
        }
        
        .map-card {
            width: calc(100% - 32px);
            max-width: 600px;
            background-color: #2A0000;
            border: 2px solid #7A0000;
            border-radius: 20px;
            margin: 16px;
            padding: 16px;
        }
        
        .map-image-container {
            width: 100%;
            min-height: 180px; /* Оригинальная высота */
            border-radius: 0;
            overflow: hidden;
            background-color: transparent;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .map-image {
            width: 100%;
            height: auto; /* Оригинальная настройка */
            object-fit: contain; /* Оригинальная настройка */
            background-color: transparent;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        .map-image.loaded {
            opacity: 1;
        }
        
        .map-name {
            color: #FF4C4C;
            font-size: 24px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 12px;
            padding: 0;
            line-height: 1.2;
        }
        
        .map-status {
            color: #FFFFFF;
            font-size: 18px;
            text-align: center;
            margin-bottom: 4px;
            font-weight: 500;
        }
        
        .timer {
            font-family: 'Roboto Mono', monospace;
            font-size: 18px;
            color: #FFFFFF;
            text-align: center;
            margin: 4px 0;
            font-variant-numeric: tabular-nums;
            display: inline;
        }
        
        .status-timer-container {
            color: #FFFFFF;
            font-size: 18px;
            text-align: center;
            margin-bottom: 4px;
            font-weight: 500;
        }
        
        .map-date {
            color: #BBBBBB;
            font-size: 16px;
            text-align: center;
            padding: 2px 0 8px 0;
        }
        
        .status-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 24px;
            background-color: #000000;
            z-index: 1000;
        }
        
        /* Стиль для прелоадера изображений */
        .image-placeholder {
            width: 100%;
            height: 180px; /* Оригинальная высота */
            background: linear-gradient(90deg, #1a0000 25%, #2a0000 50%, #1a0000 75%);
            background-size: 400% 100%;
            animation: loading 1.5s infinite;
            border-radius: 8px;
        }
        
        @keyframes loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
        
        @media (max-width: 600px) {
            .map-card {
                width: calc(100% - 32px);
                margin: 16px;
            }
            
            .header-text {
                font-size: 36px;
            }
            
            .map-name {
                font-size: 24px;
            }
        }
        
        @media (max-width: 400px) {
            .header-text {
                font-size: 32px;
            }
            
            .map-name {
                font-size: 22px;
            }
            
            .map-status {
                font-size: 18px;
            }
            
            .map-date {
                font-size: 16px;
            }
            
            .timer {
                font-size: 16px;
            }
            
            .status-timer-container {
                font-size: 16px;
            }
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
    <div class="status-bar"></div>
    
    <div class="scroll-view" id="scrollView">
        <div class="main-container" id="mainContainer">

        </div>
    </div>

    <script>
        const mapNames = [
            "Штольня",
            "Лотос", 
            "Крокет",
            "Всё или Ничего",
            "Полёт Фантазии",
            "Лесные Лилии",
            "Станция «Северный Парк»",
            "Запутанная Лоза",
            "Убежище",
            "Озеро Мертвецов",
            "Строительные Леса",
            "Замок Кристального ока",
            "Тысяча Озёр",
            "Закрытое Сообщество"
        ];

        // Функция для получения пути к изображению
        function getMapImagePath(mapId) {
            const baseUrl = window.location.origin + window.location.pathname;
            const baseDir = baseUrl.substring(0, baseUrl.lastIndexOf('/'));
            
            // Прямые пути к изображениям на GitHub Pages
            return `${baseDir}/${mapId}.png`;
        }

        // ПРЕДЗАГРУЗКА ВСЕХ ИЗОБРАЖЕНИЙ ПЕРЕД ПОКАЗОМ СТРАНИЦЫ
        function preloadAllImages() {
            const imagesToPreload = [];
            
            for (let i = 1; i <= 14; i++) {
                const img = new Image();
                img.src = getMapImagePath(i);
                img.crossOrigin = "anonymous";
                imagesToPreload.push(img);
            }
            
            return Promise.all(
                imagesToPreload.map(img => {
                    return new Promise((resolve, reject) => {
                        img.onload = resolve;
                        img.onerror = resolve; // Не реджектим, чтобы страница загрузилась в любом случае
                    });
                })
            );
        }

        function getCurrentMapIndex() {
            const now = new Date();
            const moscowTime = new Date(now.toLocaleString("en-US", {timeZone: "Europe/Moscow"}));
            const baseDate = new Date(Date.UTC(2025, 0, 21, 21, 0, 0));
            const diff = moscowTime.getTime() - baseDate.getTime();
            let days = Math.floor(diff / (1000 * 60 * 60 * 24));
            
            if (moscowTime.getHours() >= 23) {
                days++;
            }
            
            return (7 + days) % 14;
        }

        function formatDate(date) {
            const months = [
                'января', 'февраля', 'марта', 'апреля', 'мая', 'июня',
                'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'
            ];
            
            const weekdays = [
                'воскресенье', 'понедельник', 'вторник', 'среда',
                'четверг', 'пятница', 'суббота'
            ];
            
            const day = date.getDate();
            const month = months[date.getMonth()];
            const weekday = weekdays[date.getDay()];
            
            return `${day} ${month}, ${weekday}`;
        }

        function getTimeUntilMapActivation(mapPosition) {
            const now = new Date();
            const moscowNow = new Date(now.toLocaleString("en-US", {timeZone: "Europe/Moscow"}));
            
            let activationDate = new Date(moscowNow);
            
            if (moscowNow.getHours() < 23) {
                activationDate.setDate(activationDate.getDate() + Math.max(0, mapPosition - 1));
            } else {
                activationDate.setDate(activationDate.getDate() + mapPosition);
            }
            
            activationDate.setHours(23, 0, 0, 0);
            
            const diff = activationDate.getTime() - moscowNow.getTime();
            const seconds = Math.floor(diff / 1000);
            
            const days = Math.floor(seconds / 86400);
            const hours = Math.floor((seconds % 86400) / 3600);
            const minutes = Math.floor((seconds % 3600) / 60);
            const secs = seconds % 60;
            
            return {
                days: days.toString().padStart(2, '0'),
                hours: hours.toString().padStart(2, '0'),
                minutes: minutes.toString().padStart(2, '0'),
                seconds: secs.toString().padStart(2, '0'),
                formatted: `${days.toString().padStart(2, '0')}:${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`
            };
        }

        function getMapActivationDate(position) {
            const now = new Date();
            const moscowNow = new Date(now.toLocaleString("en-US", {timeZone: "Europe/Moscow"}));
            
            const activationDate = new Date(moscowNow);
            
            if (moscowNow.getHours() < 23) {
                activationDate.setDate(activationDate.getDate() + Math.max(0, position - 1));
            } else {
                activationDate.setDate(activationDate.getDate() + position);
            }
            
            activationDate.setHours(23, 0, 0, 0);
            return activationDate;
        }

        function createMapCard(mapIndex, position) {
            const mapId = mapIndex + 1;
            const mapName = mapNames[mapIndex];
            const imagePath = getMapImagePath(mapId);
            
            const activationDate = getMapActivationDate(position);
            const dateText = formatDate(activationDate);
            
            let statusHtml = '';
            
            if (position === 0) {
                statusHtml = '<div class="map-status">Сегодня</div>';
            } else {
                const timeUntil = getTimeUntilMapActivation(position);
                statusHtml = `
                    <div class="status-timer-container">
                        Через <span class="timer" id="timer-${mapId}">${timeUntil.formatted}</span>
                    </div>
                `;
            }
            
            return `
                <div class="map-card" id="map-card-${mapId}">
                    <div class="map-image-container">
                        <div class="image-placeholder" id="placeholder-${mapId}"></div>
                        <img src="${imagePath}" alt="${mapName}" class="map-image" 
                             id="img-${mapId}"
                             onload="document.getElementById('placeholder-${mapId}').style.display='none'; this.classList.add('loaded')"
                             onerror="this.style.display='none'; document.getElementById('placeholder-${mapId}').style.background='#1a0000'; document.getElementById('placeholder-${mapId}').innerHTML='<div style=\\'color:#ff4c4c;text-align:center;padding-top:70px;\\'>Ошибка загрузки</div>'; document.getElementById('placeholder-${mapId}').style.animation='none'">
                    </div>
                    <div class="map-name">${mapName}</div>
                    ${statusHtml}
                    <div class="map-date">${dateText}</div>
                </div>
            `;
        }

        function updateAllTimers() {
            for (let position = 1; position < 14; position++) {
                const timeUntil = getTimeUntilMapActivation(position);
                const mapIndex = (getCurrentMapIndex() + position) % 14;
                const mapId = mapIndex + 1;
                
                const timerElement = document.getElementById(`timer-${mapId}`);
                if (timerElement) {
                    timerElement.textContent = timeUntil.formatted;
                }
            }
        }

        async function initApp() {
            const mainContainer = document.getElementById('mainContainer');
            
            // Показываем заголовк сразу
            mainContainer.innerHTML = `
                <div class="header">
                    <div class="header-text">Created by Cvieripe</div>
                </div>
            `;
            
            // Начинаем предзагрузку изображений в фоне
            preloadAllImages();
            
            // Создаем карточки
            const currentMapIndex = getCurrentMapIndex();
            
            for (let i = 0; i < 14; i++) {
                const mapIndex = (currentMapIndex + i) % 14;
                const cardHtml = createMapCard(mapIndex, i);
                mainContainer.innerHTML += cardHtml;
            }
            
            // Запускаем таймеры
            setInterval(updateAllTimers, 1000);
            updateAllTimers();
            
            // Принудительная проверка загрузки изображений через 2 секунды
            setTimeout(() => {
                for (let i = 1; i <= 14; i++) {
                    const img = document.getElementById(`img-${i}`);
                    if (img && img.naturalWidth === 0) {
                        // Изображение не загрузилось, пробуем перезагрузить
                        const originalSrc = img.src;
                        img.src = originalSrc + (originalSrc.includes('?') ? '&' : '?') + 't=' + Date.now();
                    }
                }
            }, 2000);
            
            // Еще одна проверка через 5 секунд
            setTimeout(() => {
                for (let i = 1; i <= 14; i++) {
                    const img = document.getElementById(`img-${i}`);
                    const placeholder = document.getElementById(`placeholder-${i}`);
                    if (img && img.naturalWidth === 0 && placeholder) {
                        placeholder.style.display = 'block';
                        img.style.display = 'none';
                    }
                }
            }, 5000);
        }

        // Ждем полной загрузки DOM
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initApp);
        } else {
            initApp();
        }
        
        // Добавляем перезагрузку изображений при фокусе окна
        window.addEventListener('focus', function() {
            setTimeout(() => {
                document.querySelectorAll('.map-image').forEach(img => {
                    if (img.naturalWidth === 0) {
                        const originalSrc = img.src;
                        img.src = originalSrc + (originalSrc.includes('?') ? '&' : '?') + 't=' + Date.now();
                    }
                });
            }, 100);
        });
    </script>
</body>
</html>
