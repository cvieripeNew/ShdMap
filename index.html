<!doctype html><html lang=ru><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>ShdMap</title><style>@font-face{font-family:cf;src:url(font.ttf)}*{margin:0;padding:0;box-sizing:border-box}body{background:#000;color:#fff;font-family:system-ui,sans-serif}#s{position:fixed;top:0;left:0;right:0;bottom:0;overflow-y:scroll}#c{width:100%;display:flex;flex-direction:column;align-items:center;padding-top:24px}.h{width:100%;text-align:center;padding:24px 0 8px}.t{color:#fff;font-size:36px;font-family:cf}.card{width:calc(100% - 32px);max-width:600px;background:#200;border:2px solid #700;border-radius:20px;margin:16px;padding:16px}.imgc{width:100%;aspect-ratio:1/1;margin-bottom:12px}.img{width:100%;height:100%;object-fit:contain;display:none}.img.loaded{display:block}.name{color:#f44;font-size:24px;font-weight:700;text-align:center;margin-bottom:12px}.status{color:#fff;font-size:18px;text-align:center;margin-bottom:4px}.timer{font-family:'Roboto Mono',monospace;font-size:18px;color:#fff}.date{color:#bbb;font-size:16px;text-align:center}.ph{width:100%;aspect-ratio:1/1;background:#100}@media(max-width:600px){.card{width:calc(100% - 32px);margin:16px}.t{font-size:36px}.name{font-size:24px}}@media(max-width:400px){.t{font-size:32px}.name{font-size:22px}.status{font-size:16px}.timer{font-size:16px}.date{font-size:14px}}</style></head><body><div id=s><div id=c></div></div><script>const maps=["Штольня","Лотос","Крокет","Всё или Ничего","Полёт Фантазии","Лесные Лилии","Станция «Северный Парк»","Запутанная Лоза","Убежище","Озеро Мертвецов","Строительные Леса","Замок Кристального ока","Тысяча Озёр","Закрытое Сообщество"];function getImgPath(i){const b=location.origin+location.pathname,d=b.substring(0,b.lastIndexOf('/'));return d+'/'+i+'.png'}function getCurrent(){const n=new Date,d=new Date(n.toLocaleString("en-US",{timeZone:"Europe/Moscow"})),b=new Date(Date.UTC(2025,0,21,21)),t=d.getTime()-b.getTime();let a=Math.floor(t/864e5);d.getHours()>=23&&a++;return(7+a)%14}function formatDate(d){const m=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'],w=['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];return d.getDate()+' '+m[d.getMonth()]+', '+w[d.getDay()]}function getTimer(p){const n=new Date,d=new Date(n.toLocaleString("en-US",{timeZone:"Europe/Moscow"})),a=new Date(d);a.setDate(a.getDate()+p-1);a.setHours(23,0,0,0);const s=Math.floor((a.getTime()-d.getTime())/1e3),D=Math.floor(s/86400),h=Math.floor(s%86400/3600),M=Math.floor(s%3600/60),S=s%60;return(D<10?'0':'')+D+':'+(h<10?'0':'')+h+':'+(M<10?'0':'')+M+':'+(S<10?'0':'')+S}function getDate(p){const n=new Date,d=new Date(n.toLocaleString("en-US",{timeZone:"Europe/Moscow"})),r=new Date(d);r.setDate(r.getDate()+p);r.setHours(23,0,0,0);return r}const io=new IntersectionObserver((e)=>{e.forEach(entry=>{if(entry.isIntersecting){const img=entry.target.querySelector('.img');if(img&&!img.classList.contains('loaded')){img.src=img.dataset.src;img.onload=()=>img.classList.add('loaded')}}})},{rootMargin:'200px'});function createCard(i,pos){const idx=i+1,name=maps[i],src=getImgPath(idx),date=getDate(pos),dateText=formatDate(date),timer=pos===0?'<div class=status>Сегодня</div>':'<div class=status>Через <span class=timer id=t-'+idx+'>'+getTimer(pos)+'</span></div>';return'<div class=card><div class=imgc><div class=ph></div><img data-src="'+src+'" alt="'+name+'" class=img id=i-'+idx+'></div><div class=name>'+name+'</div>'+timer+'<div class=date>'+dateText+'</div></div>'}function updateTimers(){for(let p=1;p<14;p++){const timer=getTimer(p),idx=(getCurrent()+p)%14+1,e=document.getElementById('t-'+idx);e&&(e.textContent=timer)}}function init(){const c=document.getElementById('c');c.innerHTML='<div class=h><div class=t>Created by Cvieripe</div></div>';const cur=getCurrent();for(let i=0;i<14;i++){const idx=(cur+i)%14;c.innerHTML+=createCard(idx,i)}setTimeout(()=>{document.querySelectorAll('.card').forEach(card=>io.observe(card))},0);setInterval(updateTimers,1000);updateTimers()}document.readyState=='loading'?document.addEventListener('DOMContentLoaded',init):init();</script></body></html>
