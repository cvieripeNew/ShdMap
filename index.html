<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShdMap</title>
    <style>
        @font-face{font-family:'CustomFont';src:url('font.ttf') format('truetype');}
        *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
        body{background:#000;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#FFF;overflow-x:hidden;}
        #scrollView{position:fixed;top:0;left:0;right:0;bottom:0;overflow-y:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
        #scrollView::-webkit-scrollbar{display:none;}
        #mainContainer{width:100%;display:flex;flex-direction:column;align-items:center;padding:24px 0 40px;}
        .header{width:100%;text-align:center;padding:24px 0 8px;}
        .header-text{color:#FFF;font-size:36px;font-weight:400;letter-spacing:.5px;font-family:'CustomFont',-apple-system,sans-serif;}
        .map-card{width:calc(100% - 32px);max-width:600px;background:#2A0000;border:2px solid #7A0000;border-radius:20px;margin:16px;padding:16px;}
        .map-image-container{width:100%;min-height:180px;border-radius:12px;overflow:hidden;background:transparent;margin-bottom:12px;}
        .map-image{width:100%;height:auto;object-fit:cover;opacity:0;transition:opacity .3s;border-radius:12px;}
        .map-image.loaded{opacity:1;}
        .map-name{color:#FF4C4C;font-size:24px;font-weight:700;text-align:center;margin-bottom:12px;}
        .map-status{color:#FFF;font-size:18px;text-align:center;margin-bottom:4px;font-weight:500;}
        .timer{font-family:'Roboto Mono',monospace;font-size:18px;color:#FFF;text-align:center;margin:4px 0;font-variant-numeric:tabular-nums;display:inline;}
        .status-timer-container{color:#FFF;font-size:18px;text-align:center;margin-bottom:4px;font-weight:500;}
        .map-date{color:#BBB;font-size:16px;text-align:center;padding:2px 0 8px;}
        .status-bar{position:fixed;top:0;left:0;right:0;height:24px;background:#000;z-index:1000;}
        .image-placeholder{width:100%;height:180px;background:linear-gradient(90deg,#1a0000 25%,#2a0000 50%,#1a0000 75%);background-size:400% 100%;animation:loading 1.5s infinite;border-radius:12px;}
        @keyframes loading{0%{background-position:200% 0;}100%{background-position:-200% 0;}}
        @media(max-width:600px){.map-card{width:calc(100% - 32px);margin:16px;}.header-text{font-size:36px;}.map-name{font-size:24px;}}
        @media(max-width:400px){.header-text{font-size:32px;}.map-name{font-size:22px;}.map-status,.status-timer-container{font-size:16px;}.map-date{font-size:16px;}.timer{font-size:16px;}}
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
    <div class="status-bar"></div>
    <div class="scroll-view" id="scrollView">
        <div class="main-container" id="mainContainer"></div>
    </div>
    <script>
        const mapNames=["Штольня","Лотос","Крокет","Всё или Ничего","Полёт Фантазии","Лесные Лилии","Станция «Северный Парк»","Запутанная Лоза","Убежище","Озеро Мертвецов","Строительные Леса","Замок Кристального ока","Тысяча Озёр","Закрытое Сообщество"];
        
        function createMapCard(mapIndex, position) {
            const mapId = mapIndex + 1;
            const mapName = mapNames[mapIndex];
            const imagePath = window.location.origin + window.location.pathname.substring(0, window.location.pathname.lastIndexOf('/')) + '/' + mapId + '.png';
            
            const now = new Date();
            const moscowNow = new Date(now.toLocaleString("en-US", {timeZone: "Europe/Moscow"}));
            const activationDate = new Date(moscowNow);
            activationDate.setDate(activationDate.getDate() + position);
            activationDate.setHours(23, 0, 0, 0);
            
            const months = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
            const weekdays = ['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];
            const dateText = activationDate.getDate() + ' ' + months[activationDate.getMonth()] + ', ' + weekdays[activationDate.getDay()];
            
            let statusHtml = '';
            if (position === 0) {
                statusHtml = '<div class="map-status">Сегодня</div>';
            } else {
                const diff = activationDate.getTime() - moscowNow.getTime();
                const seconds = Math.floor(diff / 1000);
                const days = Math.floor(seconds / 86400);
                const hours = Math.floor((seconds % 86400) / 3600);
                const minutes = Math.floor((seconds % 3600) / 60);
                const secs = seconds % 60;
                const formatted = `${days.toString().padStart(2,'0')}:${hours.toString().padStart(2,'0')}:${minutes.toString().padStart(2,'0')}:${secs.toString().padStart(2,'0')}`;
                
                statusHtml = `<div class="status-timer-container">Через <span class="timer" id="timer-${mapId}">${formatted}</span></div>`;
            }
            
            return `<div class="map-card" id="map-card-${mapId}">
                <div class="map-image-container">
                    <div class="image-placeholder" id="placeholder-${mapId}"></div>
                    <img src="${imagePath}" alt="${mapName}" class="map-image" id="img-${mapId}"
                         onload="document.getElementById('placeholder-${mapId}').style.display='none'; this.classList.add('loaded')"
                         onerror="this.style.display='none'; document.getElementById('placeholder-${mapId}').style.background='#1a0000'; document.getElementById('placeholder-${mapId}').innerHTML='<div style=&quot;color:#ff4c4c;text-align:center;padding-top:70px;&quot;>Ошибка загрузки</div>'; document.getElementById('placeholder-${mapId}').style.animation='none'">
                </div>
                <div class="map-name">${mapName}</div>
                ${statusHtml}
                <div class="map-date">${dateText}</div>
            </div>`;
        }

        function getCurrentMapIndex() {
            const now = new Date();
            const moscowTime = new Date(now.toLocaleString("en-US", {timeZone: "Europe/Moscow"}));
            const baseDate = new Date(Date.UTC(2025, 0, 21, 21, 0, 0));
            const diff = moscowTime.getTime() - baseDate.getTime();
            let days = Math.floor(diff / (1000 * 60 * 60 * 24));
            
            if (moscowTime.getHours() >= 23) days++;
            
            return (7 + days) % 14;
        }

        function updateAllTimers() {
            for (let position = 1; position < 14; position++) {
                const now = new Date();
                const moscowNow = new Date(now.toLocaleString("en-US", {timeZone: "Europe/Moscow"}));
                const activationDate = new Date(moscowNow);
                activationDate.setDate(activationDate.getDate() + position);
                activationDate.setHours(23, 0, 0, 0);
                
                const diff = activationDate.getTime() - moscowNow.getTime();
                const seconds = Math.floor(diff / 1000);
                const days = Math.floor(seconds / 86400);
                const hours = Math.floor((seconds % 86400) / 3600);
                const minutes = Math.floor((seconds % 3600) / 60);
                const secs = seconds % 60;
                const formatted = `${days.toString().padStart(2,'0')}:${hours.toString().padStart(2,'0')}:${minutes.toString().padStart(2,'0')}:${secs.toString().padStart(2,'0')}`;
                
                const mapIndex = (getCurrentMapIndex() + position) % 14;
                const mapId = mapIndex + 1;
                const timerElement = document.getElementById(`timer-${mapId}`);
                if (timerElement) timerElement.textContent = formatted;
            }
        }

        async function initApp() {
            const mainContainer = document.getElementById('mainContainer');
            mainContainer.innerHTML = `<div class="header"><div class="header-text">Created by Cvieripe</div></div>`;
            
            const currentMapIndex = getCurrentMapIndex();
            for (let i = 0; i < 14; i++) {
                const mapIndex = (currentMapIndex + i) % 14;
                mainContainer.innerHTML += createMapCard(mapIndex, i);
            }
            
            setInterval(updateAllTimers, 1000);
            updateAllTimers();
            
            setTimeout(() => {
                for (let i = 1; i <= 14; i++) {
                    const img = document.getElementById(`img-${i}`);
                    if (img && img.naturalWidth === 0) {
                        const originalSrc = img.src;
                        img.src = originalSrc + (originalSrc.includes('?') ? '&' : '?') + 't=' + Date.now();
                    }
                }
            }, 2000);
        }

        document.readyState === 'loading' ? document.addEventListener('DOMContentLoaded', initApp) : initApp();
    </script>
</body>
</html>
