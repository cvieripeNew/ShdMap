<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShdMap</title>
    <style>
        @font-face{font-family:'CustomFont';src:url('font.ttf') format('truetype');}
        *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
        body{background:#000;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#FFF;overflow-x:hidden;}
        #scrollView{position:fixed;top:0;left:0;right:0;bottom:0;overflow-y:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
        #scrollView::-webkit-scrollbar{display:none;}
        #mainContainer{width:100%;display:flex;flex-direction:column;align-items:center;padding:24px 0 40px;}
        .header{width:100%;text-align:center;padding:24px 0 8px;}
        .header-text{color:#FFF;font-size:36px;font-weight:400;letter-spacing:.5px;font-family:'CustomFont',-apple-system,sans-serif;}
        .map-card{width:calc(100% - 32px);max-width:600px;background:#2A0000;border:2px solid #7A0000;border-radius:20px;margin:16px;padding:16px;}
        .map-image-container{width:100%;min-height:180px;border-radius:12px;overflow:hidden;background:transparent;margin-bottom:12px;}
        .map-image{width:100%;height:auto;object-fit:cover;opacity:0;transition:opacity .3s;border-radius:12px;}
        .map-image.loaded{opacity:1;}
        .map-name{color:#FF4C4C;font-size:24px;font-weight:700;text-align:center;margin-bottom:12px;}
        .map-status{color:#FFF;font-size:18px;text-align:center;margin-bottom:4px;font-weight:500;}
        .timer{font-family:'Roboto Mono',monospace;font-size:18px;color:#FFF;text-align:center;margin:4px 0;font-variant-numeric:tabular-nums;display:inline;}
        .status-timer-container{color:#FFF;font-size:18px;text-align:center;margin-bottom:4px;font-weight:500;}
        .map-date{color:#BBB;font-size:16px;text-align:center;padding:2px 0 8px;}
        .status-bar{position:fixed;top:0;left:0;right:0;height:24px;background:#000;z-index:1000;}
        .image-placeholder{width:100%;height:180px;background:linear-gradient(90deg,#1a0000 25%,#2a0000 50%,#1a0000 75%);background-size:400% 100%;animation:loading 1.5s infinite;border-radius:12px;}
        @keyframes loading{0%{background-position:200% 0;}100%{background-position:-200% 0;}}
        @media(max-width:600px){.map-card{width:calc(100% - 32px);margin:16px;}.header-text{font-size:36px;}.map-name{font-size:24px;}}
        @media(max-width:400px){.header-text{font-size:32px;}.map-name{font-size:22px;}.map-status,.status-timer-container{font-size:16px;}.map-date{font-size:16px;}.timer{font-size:16px;}}
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
    <div class="status-bar"></div>
    <div class="scroll-view" id="scrollView">
        <div class="main-container" id="mainContainer"></div>
    </div>
    <script>
        const mapNames=["Штольня","Лотос","Крокет","Всё или Ничего","Полёт Фантазии","Лесные Лилии","Станция «Северный Парк»","Запутанная Лоза","Убежище","Озеро Мертвецов","Строительные Леса","Замок Кристального ока","Тысяча Озёр","Закрытое Сообщество"];
        function getMapImagePath(m){return window.location.origin+window.location.pathname.substring(0,window.location.pathname.lastIndexOf('/'))+'/'+m+'.png';}
        function preloadAllImages(){return Promise.all(Array.from({length:14},(_,i)=>new Promise(r=>{const img=new Image();img.src=getMapImagePath(i+1);img.onload=r;img.onerror=r;})));}
        function getCurrentMapIndex(){const n=new Date(),m=new Date(n.toLocaleString("en-US",{timeZone:"Europe/Moscow"})),b=new Date(Date.UTC(2025,0,21,21,0,0)),d=m.getTime()-b.getTime();let ds=Math.floor(d/(1e3*60*60*24));return m.getHours()>=23&&ds++,(7+ds)%14;}
        function formatDate(d){const m=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'],w=['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];return d.getDate()+' '+m[d.getMonth()]+', '+w[d.getDay()];}
        function getTimeUntilMapActivation(p){const n=new Date(),m=new Date(n.toLocaleString("en-US",{timeZone:"Europe/Moscow"})),a=new Date(m);a.setDate(a.getDate()+p);a.setHours(23,0,0,0);const s=Math.floor((a.getTime()-m.getTime())/1e3),d=Math.floor(s/86400),h=Math.floor((s%86400)/3600),m2=Math.floor((s%3600)/60),sc=s%60;return{formatted:`${d.toString().padStart(2,'0')}:${h.toString().padStart(2,'0')}:${m2.toString().padStart(2,'0')}:${sc.toString().padStart(2,'0')}`};}
        function getMapActivationDate(p){const n=new Date(),m=new Date(n.toLocaleString("en-US",{timeZone:"Europe/Moscow"}));const a=new Date(m);a.setDate(a.getDate()+p);a.setHours(23,0,0,0);return a;}
        function createMapCard(i,p){const id=i+1,n=mapNames[i],ip=getMapImagePath(id),ad=getMapActivationDate(p),dt=formatDate(ad);let sh='';if(p===0)sh='<div class="map-status">Сегодня</div>';else{const tu=getTimeUntilMapActivation(p);sh=`<div class="status-timer-container">Через <span class="timer" id="timer-${id}">${tu.formatted}</span></div>`;}
            return `<div class="map-card" id="map-card-${id}"><div class="map-image-container"><div class="image-placeholder" id="placeholder-${id}"></div><img src="${ip}" alt="${n}" class="map-image" id="img-${id}" onload="document.getElementById('placeholder-${id}').style.display='none';this.classList.add('loaded')" onerror="this.style.display='none';document.getElementById('placeholder-${id}').style.background='#1a0000';document.getElementById('placeholder-${id}').innerHTML='<div style=\"color:#ff4c4c;text-align:center;padding-top:70px;\">Ошибка загрузки</div>';document.getElementById('placeholder-${id}').style.animation='none'"></div><div class="map-name">${n}</div>${sh}<div class="map-date">${dt}</div></div>`;}
        function updateAllTimers(){for(let p=1;p<14;p++){const tu=getTimeUntilMapActivation(p),i=(getCurrentMapIndex()+p)%14,id=i+1,e=document.getElementById(`timer-${id}`);e&&(e.textContent=tu.formatted);}}
        async function initApp(){const mc=document.getElementById('mainContainer');mc.innerHTML=`<div class="header"><div class="header-text">Created by Cvieripe</div></div>`;preloadAllImages();const cmi=getCurrentMapIndex();for(let i=0;i<14;i++){const mi=(cmi+i)%14;mc.innerHTML+=createMapCard(mi,i);}setInterval(updateAllTimers,1000);updateAllTimers();setTimeout(()=>{for(let i=1;i<=14;i++){const e=document.getElementById(`img-${i}`);if(e&&e.naturalWidth===0){const os=e.src;e.src=os+(os.includes('?')?'&':'?')+'t='+Date.now();}}},2000);setTimeout(()=>{for(let i=1;i<=14;i++){const e=document.getElementById(`img-${i}`),p=document.getElementById(`placeholder-${i}`);if(e&&e.naturalWidth===0&&p){p.style.display='block';e.style.display='none';}}},5000);}
        document.readyState==='loading'?document.addEventListener('DOMContentLoaded',initApp):initApp();
        window.addEventListener('focus',()=>{setTimeout(()=>{document.querySelectorAll('.map-image').forEach(e=>{if(e.naturalWidth===0){const os=e.src;e.src=os+(os.includes('?')?'&':'?')+'t='+Date.now();}});},100);});
    </script>
</body>
</html>
