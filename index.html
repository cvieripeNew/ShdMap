<!doctype html>
<html lang=ru>
<head>
<meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1">
<title>ShdMap</title>
<style>
@font-face{font-family:cf;src:url(font.ttf) format(truetype)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#000;color:#fff;font-family:system-ui,sans-serif;min-height:100vh;overflow-x:hidden;overscroll-behavior-y:none}
#a{position:fixed;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;will-change:transform}
#a::-webkit-scrollbar{display:none}
#b{width:100%;display:flex;flex-direction:column;align-items:center;padding:24px 0 40px;transform:translateZ(0)}
.c{width:100%;text-align:center;padding:24px 0 8px}
.d{color:#fff;font-size:36px;font-weight:400;letter-spacing:.5px;font-family:cf,sans-serif}
.e{width:calc(100% - 32px);max-width:600px;background:#200;border:2px solid #700;border-radius:20px;margin:16px;padding:16px;transform:translateZ(0)}
.f{width:100%;min-height:180px;margin-bottom:12px;display:flex;align-items:center;justify-content:center}
.g{width:100%;height:auto;object-fit:contain;opacity:0;transition:opacity .2s;image-rendering:crisp-edges;backface-visibility:hidden}
.g.l{opacity:1}
.h{color:#f44;font-size:24px;font-weight:700;text-align:center;margin-bottom:12px;line-height:1.2}
.i,.j{color:#fff;font-size:18px;text-align:center;margin-bottom:4px;font-weight:500}
.k{font-family:'Roboto Mono',monospace;font-size:18px;color:#fff;text-align:center;margin:4px 0;font-variant-numeric:tabular-nums;display:inline}
.l{color:#bbb;font-size:16px;text-align:center;padding:2px 0 8px}
.m{position:fixed;top:0;left:0;right:0;height:24px;background:#000;z-index:1000}
.n{width:100%;height:180px;background:linear-gradient(90deg,#100 25%,#200 50%,#100 75%);background-size:400% 100%;animation:o 1.5s infinite}
@keyframes o{0%{background-position:200% 0}to{background-position:-200% 0}}
@media (max-width:600px){.e{width:calc(100% - 32px);margin:16px}.d{font-size:36px}.h{font-size:24px}}
@media (max-width:400px){.d{font-size:32px}.h{font-size:22px}.i,.j{font-size:16px}.k{font-size:16px}.l{font-size:14px}}
</style>
<link rel=stylesheet href=https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500>
</head>
<body>
<div class=m></div>
<div id=a><div id=b></div></div>
<script>
const M=["Штольня","Лотос","Крокет","Всё или Ничего","Полёт Фантазии","Лесные Лилии","Станция «Северный Парк»","Запутанная Лоза","Убежище","Озеро Мертвецов","Строительные Леса","Замок Кристального ока","Тысяча Озёр","Закрытое Сообщество"];
function L(i){let b=location.origin+location.pathname,d=b.substring(0,b.lastIndexOf('/'));return d+'/'+i+'.png'}
let imgCache={},ticking=false,lastScrollTime=0;
function K(){for(let i=1;i<=14;i++){let img=new Image();img.src=L(i);imgCache[i]=img}}
function J(){let n=new Date,d=new Date(n.toLocaleString('en-US',{timeZone:'Europe/Moscow'})),b=new Date(Date.UTC(2025,0,21,21)),t=d.getTime()-b.getTime(),a=Math.floor(t/864e5);return d.getHours()>=23&&a++,(7+a)%14}
function I(d){let m=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'],w=['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];return d.getDate()+' '+m[d.getMonth()]+', '+w[d.getDay()]}
function H(p){let n=new Date,d=new Date(n.toLocaleString('en-US',{timeZone:'Europe/Moscow'})),a=new Date(d);a.setDate(a.getDate()+p-1);a.setHours(23,0,0,0);let s=Math.floor((a.getTime()-d.getTime())/1e3),D=Math.floor(s/86400),h=Math.floor(s%86400/3600),M=Math.floor(s%3600/60),S=s%60;return(D<10?'0':'')+D+':'+(h<10?'0':'')+h+':'+(M<10?'0':'')+M+':'+(S<10?'0':'')+S}
function G(p){let n=new Date,d=new Date(n.toLocaleString('en-US',{timeZone:'Europe/Moscow'})),r=new Date(d);return r.setDate(r.getDate()+p),r.setHours(23,0,0,0),r}
function F(i,p){let idx=i+1,n=M[i],u=L(idx),d=G(p),dt=I(d),tm=p===0?'<div class=i>Сегодня</div>':'<div class=j>Через <span class=k id=k-'+idx+'>'+H(p)+'</span></div>';return'<div class=e id=e-'+idx+'><div class=f><div class=n id=n-'+idx+'></div><img loading=lazy src="'+u+'" alt="'+n+'" class=g id=g-'+idx+' onload="let q=document.getElementById(\'n-'+idx+'\');q&&(q.style.display=\'none\');this.classList.add(\'l\')" onerror="this.style.display=\'none\';let q=document.getElementById(\'n-'+idx+'\');q&&(q.style.background=\'#100\',q.innerHTML=\'<div style=color:#f44;text-align:center;padding-top:70px>Ошибка</div>\',q.style.animation=\'none\')"></div><div class=h>'+n+'</div>'+tm+'<div class=l>'+dt+'</div></div>'}
function E(){if(ticking)return;ticking=true;requestAnimationFrame(()=>{let now=Date.now();if(now-lastScrollTime<100)return;lastScrollTime=now;for(let p=1;p<14;p++){let tm=H(p),idx=(J()+p)%14+1,e=document.getElementById('k-'+idx);e&&(e.textContent=tm)}ticking=false})}
async function D(){let e=document.getElementById('b');e.innerHTML='<div class=c><div class=d>Created by Cvieripe</div></div>',K();let o=J();for(let i=0;i<14;i++){let a=(o+i)%14;e.innerHTML+=F(a,i)}setInterval(()=>{requestAnimationFrame(E)},1e3);E();setTimeout(()=>{for(let i=1;i<=14;i++){let e=document.getElementById('g-'+i);e&&e.naturalWidth===0&&(e.src=e.src+(e.src.includes('?')?'&':'?')+'t='+Date.now())}},2e3);setTimeout(()=>{for(let i=1;i<=14;i++){let e=document.getElementById('g-'+i),n=document.getElementById('n-'+i);e&&e.naturalWidth===0&&n&&(n.style.display='block',e.style.display='none')}},5e3)}
document.readyState=='loading'?document.addEventListener('DOMContentLoaded',D):D();
window.addEventListener('focus',()=>{setTimeout(()=>{document.querySelectorAll('.g').forEach(e=>{e.naturalWidth===0&&(e.src=e.src+(e.src.includes('?')?'&':'?')+'t='+Date.now())})},100)});
</script>
</body>
</html>
