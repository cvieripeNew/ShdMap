<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShdMap</title>
    <style>
        @font-face{font-family:'CustomFont';src:url('font.ttf') format('truetype');}
        *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
        body{background:#000;font-family:-apple-system,sans-serif;color:#fff;overflow-x:hidden;min-height:100vh;}
        #scrollView{position:fixed;top:0;left:0;right:0;bottom:0;overflow-y:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;-ms-overflow-style:none;}
        #scrollView::-webkit-scrollbar{display:none;}
        #mainContainer{width:100%;display:flex;flex-direction:column;align-items:center;padding:24px 0 40px;}
        .header{width:100%;text-align:center;padding:24px 0 8px;}
        .header-text{color:#fff;font-size:36px;font-weight:400;letter-spacing:0.5px;font-family:'CustomFont',sans-serif;}
        .map-card{width:calc(100% - 32px);max-width:600px;background:#2A0000;border:2px solid #7A0000;border-radius:20px;margin:16px;padding:16px;}
        .map-image-container{width:100%;min-height:180px;border-radius:12px;overflow:hidden;background:transparent;margin-bottom:12px;display:flex;align-items:center;justify-content:center;}
        .map-image{width:100%;height:auto;object-fit:cover;border-radius:8px;opacity:0;transition:opacity 0.3s;}
        .map-image.loaded{opacity:1;}
        .map-name{color:#FF4C4C;font-size:24px;font-weight:700;text-align:center;margin-bottom:12px;}
        .status-timer-container{color:#fff;font-size:18px;text-align:center;margin-bottom:4px;font-weight:500;}
        .timer{font-family:'Roboto Mono',monospace;font-size:18px;color:#fff;text-align:center;margin:4px 0;display:inline;}
        .map-date{color:#bbb;font-size:16px;text-align:center;padding:2px 0 8px;}
        .image-placeholder{width:100%;height:180px;background:linear-gradient(90deg,#1a0000 25%,#2a0000 50%,#1a0000 75%);background-size:400% 100%;animation:loading 1.5s infinite;border-radius:8px;}
        @keyframes loading{0%{background-position:200% 0;}100%{background-position:-200% 0;}}
        @media(max-width:400px){.header-text{font-size:32px;}.map-name{font-size:22px;}.status-timer-container,.timer{font-size:16px;}}
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono&display=swap" rel="stylesheet">
</head>
<body>
    <div id="scrollView"><div id="mainContainer"></div></div>
    <script>
        const mapNames=["Штольня","Лотос","Крокет","Всё или Ничего","Полёт Фантазии","Лесные Лилии","Станция «Северный Парк»","Запутанная Лоза","Убежище","Озеро Мертвецов","Строительные Леса","Замок Кристального ока","Тысяча Озёр","Закрытое Сообщество"];
        function gmi(mid){const b=window.location.origin+window.location.pathname;return b.substring(0,b.lastIndexOf('/'))+'/'+mid+'.png';}
        function pla(){for(let i=1;i<=14;i++){const img=new Image();img.src=gmi(i);img.crossOrigin="anonymous";}}
        function gci(){const n=new Date();const m=new Date(n.toLocaleString("en-US",{timeZone:"Europe/Moscow"}));const b=new Date(Date.UTC(2025,0,21,21,0,0));let d=Math.floor((m-b)/864e5);if(m.getHours()>=23)d++;return(7+d)%14;}
        function fd(d){const m=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];const w=['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];return d.getDate()+' '+m[d.getMonth()]+', '+w[d.getDay()];}
        function gtm(p){const n=new Date();const m=new Date(n.toLocaleString("en-US",{timeZone:"Europe/Moscow"}));let a=new Date(m);a.setDate(a.getDate()+p);a.setHours(23,0,0,0);const s=Math.floor((a-m)/1e3);const d=Math.floor(s/86400),h=Math.floor((s%86400)/3600),mi=Math.floor((s%3600)/60),se=s%60;return{f:`${d.toString().padStart(2,'0')}:${h.toString().padStart(2,'0')}:${mi.toString().padStart(2,'0')}:${se.toString().padStart(2,'0')}`};}
        function gmd(p){const n=new Date();const m=new Date(n.toLocaleString("en-US",{timeZone:"Europe/Moscow"}));const a=new Date(m);a.setDate(a.getDate()+p);a.setHours(23,0,0,0);return a;}
        function cmc(mi,p){const mid=mi+1;const mn=mapNames[mi];const ip=gmi(mid);const ad=gmd(p);const dt=fd(ad);let sh='';if(p===0){sh='<div class="map-status">Сегодня</div>';}else{const tu=gtm(p);sh=`<div class="status-timer-container">Через <span class="timer" id="timer-${mid}">${tu.f}</span></div>`;}
            return `<div class="map-card"><div class="map-image-container"><div class="image-placeholder" id="p-${mid}"></div><img src="${ip}" alt="${mn}" class="map-image" id="img-${mid}" onload="document.getElementById('p-${mid}').style.display='none';this.classList.add('loaded')" onerror="this.style.display='none';document.getElementById('p-${mid}').style.background='#1a0000';document.getElementById('p-${mid}').innerHTML='<div style=\"color:#ff4c4c;text-align:center;padding-top:70px;\">Ошибка</div>';document.getElementById('p-${mid}').style.animation='none'"></div><div class="map-name">${mn}</div>${sh}<div class="map-date">${dt}</div></div>`;}
        function uat(){for(let p=1;p<14;p++){const tu=gtm(p);const mi=(gci()+p)%14;const e=document.getElementById(`timer-${mi+1}`);if(e)e.textContent=tu.f;}}
        function init(){const mc=document.getElementById('mainContainer');mc.innerHTML=`<div class="header"><div class="header-text">Created by Cvieripe</div></div>`;pla();const ci=gci();for(let i=0;i<14;i++){mc.innerHTML+=cmc((ci+i)%14,i);}setInterval(uat,1000);uat();setTimeout(()=>{for(let i=1;i<=14;i++){const img=document.getElementById(`img-${i}`);if(img&&img.naturalWidth===0){img.src=img.src+(img.src.includes('?')?'&':'?')+'t='+Date.now();}}},2000);}
        if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',init);}else{init();}
        window.addEventListener('focus',()=>{setTimeout(()=>{document.querySelectorAll('.map-image').forEach(img=>{if(img.naturalWidth===0){img.src=img.src+(img.src.includes('?')?'&':'?')+'t='+Date.now();}});},100);});
    </script>
</body>
</html>
