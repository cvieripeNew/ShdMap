<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShdMap</title>
<style>
@font-face{font-family:'CustomFont';src:url('font.ttf') format('truetype');font-weight:normal;font-style:normal;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{background:#000;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#fff;overflow-x:hidden;min-height:100vh;}
#scrollView{position:fixed;top:0;left:0;right:0;bottom:0;overflow-y:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;-ms-overflow-style:none;background:#000;}
#scrollView::-webkit-scrollbar{display:none;}
#mainContainer{width:100%;display:flex;flex-direction:column;align-items:center;padding-top:24px;padding-bottom:40px;}
.header{width:100%;text-align:center;padding:24px 0 8px;}
.header-text{color:#fff;font-size:36px;font-weight:400;letter-spacing:0.5px;font-family:'CustomFont',-apple-system,sans-serif;}
.map-card{width:calc(100% - 32px);max-width:600px;background:#2A0000;border:2px solid #7A0000;border-radius:20px;margin:16px;padding:16px;}
.map-image-container{width:100%;min-height:180px;border-radius:0;overflow:hidden;background:transparent;margin-bottom:12px;display:flex;align-items:center;justify-content:center;}
.map-image{width:100%;height:auto;object-fit:contain;background:transparent;opacity:0;transition:opacity 0.3s ease;}
.map-image.loaded{opacity:1;}
.map-name{color:#FF4C4C;font-size:24px;font-weight:700;text-align:center;margin-bottom:12px;padding:0;line-height:1.2;}
.map-status{color:#fff;font-size:18px;text-align:center;margin-bottom:4px;font-weight:500;}
.timer{font-family:'Roboto Mono',monospace;font-size:18px;color:#fff;text-align:center;margin:4px 0;font-variant-numeric:tabular-nums;display:inline;}
.status-timer-container{color:#fff;font-size:18px;text-align:center;margin-bottom:4px;font-weight:500;}
.map-date{color:#BBB;font-size:16px;text-align:center;padding:2px 0 8px;}
.status-bar{position:fixed;top:0;left:0;right:0;height:24px;background:#000;z-index:1000;}
.image-placeholder{width:100%;height:180px;background:linear-gradient(90deg,#1a0000 25%,#2a0000 50%,#1a0000 75%);background-size:400% 100%;animation:loading 1.5s infinite;border-radius:8px;}
@keyframes loading{0%{background-position:200% 0;}100%{background-position:-200% 0;}}
@media (max-width:600px){.map-card{width:calc(100% - 32px);margin:16px;}.header-text{font-size:36px;}.map-name{font-size:24px;}}
@media (max-width:400px){.header-text{font-size:32px;}.map-name{font-size:22px;}.map-status,.status-timer-container{font-size:16px;}.timer{font-size:16px;}.map-date{font-size:14px;}}
</style>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
<div class="status-bar"></div>
<div class="scroll-view" id="scrollView">
<div class="main-container" id="mainContainer"></div>
</div>
<script>
const mapNames=["Штольня","Лотос","Крокет","Всё или Ничего","Полёт Фантазии","Лесные Лилии","Станция «Северный Парк»","Запутанная Лоза","Убежище","Озеро Мертвецов","Строительные Леса","Замок Кристального ока","Тысяча Озёр","Закрытое Сообщество"];
function g(m){const b=window.location.origin+window.location.pathname,d=b.substring(0,b.lastIndexOf('/'));return `${d}/${m}.png`;}
function p(){const i=[];for(let m=1;m<=14;m++){const n=new Image();n.src=g(m);n.crossOrigin="anonymous";i.push(n);}return Promise.all(i.map(n=>new Promise((r,e)=>{n.onload=r;n.onerror=r;})));}
function c(){const n=new Date(),m=new Date(n.toLocaleString("en-US",{timeZone:"Europe/Moscow"})),b=new Date(Date.UTC(2025,0,21,21,0,0)),d=m.getTime()-b.getTime();let a=Math.floor(d/(1000*60*60*24));if(m.getHours()>=23)a++;return(7+a)%14;}
function f(d){const m=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'],w=['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];return `${d.getDate()} ${m[d.getMonth()]}, ${w[d.getDay()]}`;}
function t(p){const n=new Date(),m=new Date(n.toLocaleString("en-US",{timeZone:"Europe/Moscow"}));let a=new Date(m);a.setDate(a.getDate()+p);a.setHours(23,0,0,0);const s=Math.floor((a.getTime()-m.getTime())/1000),d=Math.floor(s/86400),h=Math.floor((s%86400)/3600),mi=Math.floor((s%3600)/60),se=s%60;return{d:d.toString().padStart(2,'0'),h:h.toString().padStart(2,'0'),m:mi.toString().padStart(2,'0'),s:se.toString().padStart(2,'0'),f:`${d.toString().padStart(2,'0')}:${h.toString().padStart(2,'0')}:${mi.toString().padStart(2,'0')}:${se.toString().padStart(2,'0')}`};}
function a(p){const n=new Date(),m=new Date(n.toLocaleString("en-US",{timeZone:"Europe/Moscow"}));let d=new Date(m);d.setDate(d.getDate()+p);d.setHours(23,0,0,0);return d;}
function C(i,p){const m=i+1,n=mapNames[i],x=g(m),d=a(p),dt=f(d);let s='';if(p===0)s='<div class="map-status">Сегодня</div>';else{const t0=t(p);s=`<div class="status-timer-container">Через <span class="timer" id="timer-${m}">${t0.f}</span></div>`;}return `<div class="map-card" id="map-card-${m}"><div class="map-image-container"><div class="image-placeholder" id="placeholder-${m}"></div><img src="${x}" alt="${n}" class="map-image" id="img-${m}" onload="document.getElementById('placeholder-${m}').style.display='none'; this.classList.add('loaded')" onerror="this.style.display='none'; document.getElementById('placeholder-${m}').style.background='#1a0000'; document.getElementById('placeholder-${m}').innerHTML='<div style=\'color:#ff4c4c;text-align:center;padding-top:70px;\'>Ошибка загрузки</div>'; document.getElementById('placeholder-${m}').style.animation='none'"></div><div class="map-name">${n}</div>${s}<div class="map-date">${dt}</div></div>`;}
function u(){for(let p=1;p<14;p++){const t0=t(p),i=(c()+p)%14,m=i+1,e=document.getElementById(`timer-${m}`);if(e)e.textContent=t0.f;}}
async function i(){const m=document.getElementById('mainContainer');m.innerHTML=`<div class="header"><div class="header-text">Created by Cvieripe</div></div>`;p();const x=c();for(let i=0;i<14;i++){const a=(x+i)%14;m.innerHTML+=C(a,i);}setInterval(u,1000);u();setTimeout(()=>{for(let i=1;i<=14;i++){const m=document.getElementById(`img-${i}`);if(m&&m.naturalWidth===0){const s=m.src;m.src=s+(s.includes('?')?'&':'?')+'t='+Date.now();}}},2000);setTimeout(()=>{for(let i=1;i<=14;i++){const m=document.getElementById(`img-${i}`),p=document.getElementById(`placeholder-${i}`);if(m&&m.naturalWidth===0&&p){p.style.display='block';m.style.display='none';}}},5000);}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',i);else i();
window.addEventListener('focus',()=>{setTimeout(()=>{document.querySelectorAll('.map-image').forEach(m=>{if(m.naturalWidth===0){const s=m.src;m.src=s+(s.includes('?')?'&':'?')+'t='+Date.now();}});},100);});
</script>
</body>
</html>
