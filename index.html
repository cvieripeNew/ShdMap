<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHD Maps</title>
    <style>
        /* Загружаем локальный шрифт */
        @font-face {
            font-family: 'CustomFont';
            src: url('font.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            background-color: #000000;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #FFFFFF;
            overflow-x: hidden;
            min-height: 100vh;
        }
        
        /* Полноэкранный скролл как ScrollView */
        #scrollView {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            -ms-overflow-style: none;
            background-color: #000000;
        }
        
        #scrollView::-webkit-scrollbar {
            display: none;
        }
        
        #mainContainer {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 24px;
            padding-bottom: 40px;
        }
        
        /* Заголовок */
        .header {
            width: 100%;
            text-align: center;
            padding: 24px 0 8px 0;
        }
        
        .header-text {
            color: #FFFFFF;
            font-size: 36px;
            font-weight: 400;
            letter-spacing: 0.5px;
            font-family: 'CustomFont', -apple-system, sans-serif;
        }
        
        /* Карточка карты - точная копия Android LinearLayout */
        .map-card {
            width: calc(100% - 32px);
            max-width: 600px;
            background-color: #2A0000;
            border: 2px solid #7A0000;
            border-radius: 20px;
            margin: 16px;
            padding: 16px;
        }
        
        /* Контейнер для изображения как ImageView */
        .map-image-container {
            width: 100%;
            min-height: 180px;
            border-radius: 0;
            overflow: hidden;
            background-color: transparent;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        /* Изображение карты - квадратное как в приложении */
        .map-image {
            width: 100%;
            height: auto;
            object-fit: contain;
            background-color: transparent;
        }
        
        /* Название карты */
        .map-name {
            color: #FF4C4C;
            font-size: 24px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 12px;
            padding: 0;
            line-height: 1.2;
        }
        
        /* Статус карты */
        .map-status {
            color: #FFFFFF;
            font-size: 18px;
            text-align: center;
            margin-bottom: 4px;
            font-weight: 500;
        }
        
        /* Таймер - совмещенный со статусом */
        .timer {
            font-family: 'Roboto Mono', monospace;
            font-size: 18px;
            color: #FFFFFF;
            text-align: center;
            margin: 4px 0;
            font-variant-numeric: tabular-nums;
            display: inline;
        }
        
        /* Контейнер для статуса с таймером в одной строке */
        .status-timer-container {
            color: #FFFFFF;
            font-size: 18px;
            text-align: center;
            margin-bottom: 4px;
            font-weight: 500;
        }
        
        /* Дата карты */
        .map-date {
            color: #BBBBBB;
            font-size: 16px;
            text-align: center;
            padding: 2px 0 8px 0;
        }
        
        /* Android статус бар */
        .status-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 24px;
            background-color: #000000;
            z-index: 1000;
        }
        
        /* Для мобильных устройств */
        @media (max-width: 600px) {
            .map-card {
                width: calc(100% - 32px);
                margin: 16px;
            }
            
            .header-text {
                font-size: 36px;
            }
            
            .map-name {
                font-size: 24px;
            }
        }
        
        @media (max-width: 400px) {
            .header-text {
                font-size: 32px;
            }
            
            .map-name {
                font-size: 22px;
            }
            
            .map-status {
                font-size: 18px;
            }
            
            .map-date {
                font-size: 16px;
            }
            
            .timer {
                font-size: 16px;
            }
            
            .status-timer-container {
                font-size: 16px;
            }
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Android статус бар -->
    <div class="status-bar"></div>
    
    <!-- ScrollView как в Android -->
    <div class="scroll-view" id="scrollView">
        <div class="main-container" id="mainContainer">
            <!-- Заголовок и карточки добавятся через JS -->
        </div>
    </div>

    <script>
        // Данные карт из вашего приложения
        const mapNames = [
            "Штольня",
            "Лотос", 
            "Крокет",
            "Всё или Ничего",
            "Полёт Фантазии",
            "Лесные Лилии",
            "Станция «Северный Парк»",
            "Запутанная Лоза",
            "Убежище",
            "Озеро Мертвецов",
            "Строительные Леса",
            "Замок Кристального ока",
            "Тысяча Озёр",
            "Закрытое Сообщество"
        ];

        // Получение пути к изображению карты
        function getMapImagePath(mapId) {
            // Пробуем разные форматы изображений
            const extensions = ['.png', '.jpg', '.jpeg', '.webp'];
            
            for (const ext of extensions) {
                const path = `map_${mapId}${ext}`;
                // Проверяем существование файла
                if (imageExists(path)) {
                    return path;
                }
            }
            
            // Если изображение не найдено, используем заглушку
            return `https://via.placeholder.com/600x600/1a1a1a/FF4C4C?text=Map+${mapId}`;
        }

        // Функция для проверки существования изображения
        function imageExists(url) {
            // В реальном приложении здесь была бы проверка файла
            // Для упрощения предполагаем, что изображения есть
            return true;
        }

        // Получение текущего индекса карты (точный алгоритм из вашего кода)
        function getCurrentMapIndex() {
            const now = new Date();
            
            // Получаем московское время
            const moscowTime = new Date(now.toLocaleString("en-US", {timeZone: "Europe/Moscow"}));
            
            // Базовая дата: 22 января 2025, 00:00 MSK
            const baseDate = new Date(Date.UTC(2025, 0, 21, 21, 0, 0));
            
            // Разница в миллисекундах
            const diff = moscowTime.getTime() - baseDate.getTime();
            
            // Дни с базовой даты
            let days = Math.floor(diff / (1000 * 60 * 60 * 24));
            
            // Если сейчас 23:00 или позже по Москве, считаем следующий день
            if (moscowTime.getHours() >= 23) {
                days++;
            }
            
            // Возвращаем индекс текущей карты
            return (7 + days) % 14;
        }

        // Форматирование даты как в приложении
        function formatDate(date) {
            const months = [
                'января', 'февраля', 'марта', 'апреля', 'мая', 'июня',
                'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'
            ];
            
            const weekdays = [
                'воскресенье', 'понедельник', 'вторник', 'среда',
                'четверг', 'пятница', 'суббота'
            ];
            
            const day = date.getDate();
            const month = months[date.getMonth()];
            const weekday = weekdays[date.getDay()];
            
            return `${day} ${month}, ${weekday}`;
        }

        // Расчет времени до активации карты (для каждой карты отдельно)
        function getTimeUntilMapActivation(mapPosition) {
            const now = new Date();
            const moscowNow = new Date(now.toLocaleString("en-US", {timeZone: "Europe/Moscow"}));
            
            // Определяем дату активации этой карты
            let activationDate = new Date(moscowNow);
            
            // Логика из вашего приложения
            if (moscowNow.getHours() < 23) {
                activationDate.setDate(activationDate.getDate() + Math.max(0, mapPosition - 1));
            } else {
                activationDate.setDate(activationDate.getDate() + mapPosition);
            }
            
            activationDate.setHours(23, 0, 0, 0);
            
            // Время до активации
            const diff = activationDate.getTime() - moscowNow.getTime();
            const seconds = Math.floor(diff / 1000);
            
            const days = Math.floor(seconds / 86400);
            const hours = Math.floor((seconds % 86400) / 3600);
            const minutes = Math.floor((seconds % 3600) / 60);
            const secs = seconds % 60;
            
            return {
                days: days.toString().padStart(2, '0'),
                hours: hours.toString().padStart(2, '0'),
                minutes: minutes.toString().padStart(2, '0'),
                seconds: secs.toString().padStart(2, '0'),
                formatted: `${days.toString().padStart(2, '0')}:${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`
            };
        }

        // Получение даты активации карты
        function getMapActivationDate(position) {
            const now = new Date();
            const moscowNow = new Date(now.toLocaleString("en-US", {timeZone: "Europe/Moscow"}));
            
            const activationDate = new Date(moscowNow);
            
            // Логика из вашего приложения
            if (moscowNow.getHours() < 23) {
                activationDate.setDate(activationDate.getDate() + Math.max(0, position - 1));
            } else {
                activationDate.setDate(activationDate.getDate() + position);
            }
            
            activationDate.setHours(23, 0, 0, 0);
            return activationDate;
        }

        // Создание карточки карты
        function createMapCard(mapIndex, position) {
            const mapId = mapIndex + 1;
            const mapName = mapNames[mapIndex];
            const imagePath = getMapImagePath(mapId);
            
            const activationDate = getMapActivationDate(position);
            const dateText = formatDate(activationDate);
            
            let statusHtml = '';
            
            if (position === 0) {
                // Текущая карта - только "Сегодня"
                statusHtml = '<div class="map-status">Сегодня</div>';
            } else {
                // Будущие карты - "Через 00:00:00:00" в одной строке
                const timeUntil = getTimeUntilMapActivation(position);
                statusHtml = `
                    <div class="status-timer-container">
                        Через <span class="timer" id="timer-${mapId}">${timeUntil.formatted}</span>
                    </div>
                `;
            }
            
            // Создаем HTML структуру как в вашем приложении
            return `
                <div class="map-card" id="map-card-${mapId}">
                    <div class="map-image-container">
                        <img src="${imagePath}" alt="${mapName}" class="map-image" 
                             onerror="this.onerror=null; this.src='https://via.placeholder.com/600x600/1a1a1a/FF4C4C?text=Map+${mapId}'">
                    </div>
                    <div class="map-name">${mapName}</div>
                    ${statusHtml}
                    <div class="map-date">${dateText}</div>
                </div>
            `;
        }

        // Обновление всех таймеров
        function updateAllTimers() {
            // Обновляем таймеры для всех карт, кроме текущей (position > 0)
            for (let position = 1; position < 14; position++) {
                const timeUntil = getTimeUntilMapActivation(position);
                const mapIndex = (getCurrentMapIndex() + position) % 14;
                const mapId = mapIndex + 1;
                
                const timerElement = document.getElementById(`timer-${mapId}`);
                if (timerElement) {
                    timerElement.textContent = timeUntil.formatted;
                }
            }
        }

        // Инициализация приложения
        function initApp() {
            const mainContainer = document.getElementById('mainContainer');
            
            // Добавляем заголовок как в вашем приложении
            const headerHtml = `
                <div class="header">
                    <div class="header-text">Created by Cvieripe</div>
                </div>
            `;
            mainContainer.innerHTML = headerHtml;
            
            // Получаем текущий индекс карты
            const currentMapIndex = getCurrentMapIndex();
            
            // Создаем карточки для 14 карт в правильном порядке
            for (let i = 0; i < 14; i++) {
                const mapIndex = (currentMapIndex + i) % 14;
                const cardHtml = createMapCard(mapIndex, i);
                mainContainer.innerHTML += cardHtml;
            }
            
            // Запускаем обновление таймеров
            setInterval(updateAllTimers, 1000);
            
            // Обновляем таймеры сразу
            updateAllTimers();
            
            // Прокручиваем к началу
            setTimeout(() => {
                document.getElementById('scrollView').scrollTop = 0;
            }, 100);
        }

        // Запуск приложения при загрузке
        document.addEventListener('DOMContentLoaded', initApp);
        
        // Обработка ошибок загрузки изображений
        window.addEventListener('error', function(e) {
            if (e.target.tagName === 'IMG') {
                e.target.src = 'https://via.placeholder.com/600x600/1a1a1a/FF4C4C?text=Image+Error';
            }
        }, true);
    </script>
</body>
</html>
